AWSTemplateFormatVersion: '2010-09-09'
Description: 'Osanpo-Run Online Ranking Infrastructure'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Resources:
  # DynamoDB Table for Rankings
  RankingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-osanpo-ranking'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: playerId
          AttributeType: S
        - AttributeName: score
          AttributeType: N
      KeySchema:
        - AttributeName: playerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ScoreIndex
          KeySchema:
            - AttributeName: score
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt RankingTable.Arn

  # Submit Score Lambda
  SubmitScoreFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-submit-score'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref RankingTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])
          
          def lambda_handler(event, context):
              try:
                  body = json.loads(event['body'])
                  
                  item = {
                      'playerId': body['playerName'] + '_' + str(datetime.now().timestamp()),
                      'playerName': body['playerName'],
                      'score': int(body['score']),
                      'timestamp': body['timestamp']
                  }
                  
                  table.put_item(Item=item)
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Methods': 'POST',
                          'Access-Control-Allow-Headers': 'Content-Type'
                      },
                      'body': json.dumps({'message': 'Score submitted successfully'})
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({'error': str(e)})
                  }

  # Get Ranking Lambda
  GetRankingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-get-ranking'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref RankingTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from boto3.dynamodb.conditions import Key
          
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])
          
          def lambda_handler(event, context):
              try:
                  response = table.scan()
                  items = response['Items']
                  
                  # Sort by score descending
                  sorted_items = sorted(items, key=lambda x: int(x['score']), reverse=True)
                  
                  # Get top 10
                  top_rankings = sorted_items[:10]
                  
                  rankings = []
                  for item in top_rankings:
                      rankings.append({
                          'playerName': item['playerName'],
                          'score': int(item['score']),
                          'timestamp': item['timestamp']
                      })
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Methods': 'GET',
                          'Access-Control-Allow-Headers': 'Content-Type'
                      },
                      'body': json.dumps(rankings)
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({'error': str(e)})
                  }

  # API Gateway
  RankingApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${Environment}-osanpo-ranking-api'
      Description: 'API for Osanpo-Run ranking system'

  # Submit Score Resource
  SubmitScoreResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RankingApi
      ParentId: !GetAtt RankingApi.RootResourceId
      PathPart: submit-score

  # Get Ranking Resource
  GetRankingResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RankingApi
      ParentId: !GetAtt RankingApi.RootResourceId
      PathPart: get-ranking

  # Submit Score Method
  SubmitScoreMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RankingApi
      ResourceId: !Ref SubmitScoreResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitScoreFunction.Arn}/invocations'

  # Get Ranking Method
  GetRankingMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RankingApi
      ResourceId: !Ref GetRankingResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetRankingFunction.Arn}/invocations'

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - SubmitScoreMethod
      - GetRankingMethod
    Properties:
      RestApiId: !Ref RankingApi
      StageName: !Ref Environment

  # Lambda Permissions
  SubmitScoreLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitScoreFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RankingApi}/*/*/*'

  GetRankingLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetRankingFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RankingApi}/*/*/*'

Outputs:
  ApiEndpoint:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${RankingApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'
  
  SubmitScoreUrl:
    Description: 'Submit Score API URL'
    Value: !Sub 'https://${RankingApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/submit-score'
  
  GetRankingUrl:
    Description: 'Get Ranking API URL'
    Value: !Sub 'https://${RankingApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/get-ranking'
